    <!-- Современный шрифт Inter -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <meta property="twitter:title" content="Babay Food - Доставка еды" />
    <meta property="twitter:description" content="Доставка вкусных бургеров в Бухаре и Кагане. Быстро, вкусно, удобно!" />
    <meta property="twitter:image" content="https://babayburger.com/og-image.jpg" />
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Yandex Maps API: загружаем условно, чтобы избежать редких зависаний в Telegram WebView -->
    <script>
      (function() {
        var params = new URLSearchParams(location.search);
        var force = params.get('maps') === '1';
        var disable = params.get('no_maps') === '1';
        var isTelegram = !!(window.Telegram && window.Telegram.WebApp);

        // В Telegram WebView по умолчанию откладываем загрузку карты
        // Можно форсировать загрузку через ?maps=1 или отключить в браузере через ?no_maps=1
        var shouldLoad = force || (!isTelegram && !disable);

        function injectYandex() {
          if (document.getElementById('ymaps-sdk')) return;
          var s = document.createElement('script');
          s.id = 'ymaps-sdk';
          s.src = 'https://api-maps.yandex.ru/2.1/?apikey=3033f881-c5ec-434f-96aa-e13da893f61f&lang=ru_RU';
          s.type = 'text/javascript';
          s.defer = true;
          document.head.appendChild(s);
        }

        if (shouldLoad) {
          // В обычном браузере грузим сразу, в Telegram — с небольшой задержкой
          if (isTelegram) {
            setTimeout(injectYandex, 2500);
          } else {
            injectYandex();
          }
        } else {
          // Консольный маяк для отладки
          try { console.log('Yandex Maps: deferred in this context'); } catch(e) {}
        }
      })();
    </script>
    
    
    <!-- Базовые стили -->
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f8fafc;
        color: #1f2937;
      }
      
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Ранний отладочный оверлей до загрузки React/Vite
      try {
        document.body.innerHTML += "<pre id='early-debug' style='position:fixed;left:0;right:0;bottom:0;max-height:50vh;overflow:auto;background:#000;color:lime;padding:8px;margin:0;font-size:12px;z-index:2147483647;white-space:pre-wrap'>Запуск... (ранний отладчик)\n</pre>";
      } catch (_) {}

      (function () {
        const append = (text, color) => {
          try {
            const el = document.getElementById('early-debug');
            if (!el) return;
            if (color) el.style.color = color;
            const time = new Date().toISOString();
            el.textContent += `[${time}] ${text}\n`;
          } catch (_) {}
        };

        window.onerror = function (msg, src, line, col) {
          append(`Ошибка: ${msg} @ ${src}:${line}:${col}`, '#ff6b6b');
        };

        window.addEventListener('unhandledrejection', function (e) {
          append(`Promise error: ${String(e && e.reason)}`, '#f39c12');
        });

        ['log', 'error', 'warn'].forEach(function (lvl) {
          const orig = console[lvl];
          console[lvl] = function () {
            try {
              const args = Array.prototype.slice.call(arguments).map(function (a) {
                if (typeof a === 'string') return a;
                try { return JSON.stringify(a); } catch (e) { return String(a); }
              }).join(' ');
              append(`${lvl.toUpperCase()}: ${args}`, lvl === 'error' ? '#ff6b6b' : lvl === 'warn' ? '#f1c40f' : '#ffffff');
            } catch (_) {}
            try { orig.apply(console, arguments); } catch (_) {}
          };
        });

        document.addEventListener('click', function () {
          const el = document.getElementById('early-debug');
          if (el) el.style.display = 'none';
        }, { once: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
