<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logobabay.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Babay Burger - Оператор</title>
    <meta name="description" content="Интерфейс оператора для управления заказами ресторана Babay Burger" />
    
    <!-- PWA манифест -->
    <link rel="manifest" href="/operator-manifest.json" />
    
    <!-- Встроенный манифест как fallback -->
    <script type="application/json" id="pwa-manifest">
    {
      "name": "Babay Burger - Оператор",
      "short_name": "Babay Оператор",
      "description": "Интерфейс оператора для управления заказами ресторана Babay Burger",
      "start_url": "/operator/",
      "display": "standalone",
      "id": "/operator/",
      "background_color": "#1f2937",
      "theme_color": "#3b82f6",
      "orientation": "any",
      "scope": "/",
      "lang": "ru",
      "categories": ["business", "food", "productivity"],
      "icons": [
        {
          "src": "/logobabay.png",
          "sizes": "192x192",
          "type": "image/png",
          "purpose": "any"
        },
        {
          "src": "/logobabay.png",
          "sizes": "512x512",
          "type": "image/png",
          "purpose": "any"
        },
        {
          "src": "/logobabay.png",
          "sizes": "192x192",
          "type": "image/png",
          "purpose": "maskable"
        },
        {
          "src": "/logobabay.png",
          "sizes": "512x512",
          "type": "image/png",
          "purpose": "maskable"
        }
      ]
    }
    </script>
    
    <!-- Иконки для PWA -->
    <link rel="icon" type="image/png" href="/logobabay.png" />
    <link rel="apple-touch-icon" href="/logobabay.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logobabay.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/logobabay.png" />
    
    <!-- PWA мета-теги -->
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Babay Оператор" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Современный шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://babayburger.com/operator" />
    <meta property="og:title" content="Babay Burger - Оператор" />
    <meta property="og:description" content="Интерфейс оператора для управления заказами ресторана Babay Burger" />
    <meta property="og:image" content="https://babayburger.com/logobabay.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://babayburger.com/operator" />
    <meta property="twitter:title" content="Babay Burger - Оператор" />
    <meta property="twitter:description" content="Интерфейс оператора для управления заказами ресторана Babay Burger" />
    <meta property="twitter:image" content="https://babayburger.com/logobabay.png" />
    
    <!-- Базовые стили -->
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #1f2937;
        color: #f9fafb;
      }
      
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- PWA Service Worker -->
    <script>
      // Регистрация Service Worker для PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/operator-sw.js')
            .then((registration) => {
              console.log('🎯 Operator PWA: Service Worker registered successfully');
              
              // Проверяем обновления каждые 60 секунд
              setInterval(() => {
                registration.update();
              }, 60000);
              
              // Слушаем сообщения от Service Worker
              navigator.serviceWorker.addEventListener('message', (event) => {
                console.log('🎯 Operator PWA: Message from SW:', event.data);
                
                if (event.data.type === 'SYNC_COMPLETE') {
                  console.log('🎯 Operator PWA: Background sync completed');
                }
                
                if (event.data.type === 'PLAY_SOUND') {
                  console.log('🎯 Operator PWA: Received sound request from SW:', event.data.soundType);
                  // Делегируем воспроизведение звука основному потоку
                  window.dispatchEvent(new CustomEvent('playSoundFromSW', {
                    detail: { 
                      soundType: event.data.soundType,
                      timestamp: event.data.timestamp 
                    }
                  }));
                }
                
                if (event.data.type === 'INIT_SOUND_RESPONSE') {
                  console.log('🎯 Operator PWA: Sound system initialization response:', event.data.success);
                }
              });
            })
            .catch((error) => {
              console.error('🎯 Operator PWA: Service Worker registration failed:', error);
            });
        });
      }
      
      // Проверка критериев установки PWA
      function checkInstallCriteria() {
        const hasServiceWorker = 'serviceWorker' in navigator;
        const hasManifest = !!document.querySelector('link[rel="manifest"]');
        const isSecure = location.protocol === 'https:' || location.hostname === 'localhost';
        const hasIcons = document.querySelectorAll('link[rel*="icon"], link[rel*="apple-touch-icon"]').length > 0;
        
        return hasServiceWorker && hasManifest && isSecure && hasIcons;
      }
      
      // Проверяем критерии установки после загрузки DOM
      document.addEventListener('DOMContentLoaded', () => {
        const canInstall = checkInstallCriteria();
        console.log('🎯 Operator PWA: Install criteria met:', canInstall);
      });
      
      console.log('🎯 Operator PWA: Initialized successfully');
    </script>
  </body>
</html>
