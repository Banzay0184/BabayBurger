<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Babay Burger - Операторский интерфейс</title>
    <meta name="description" content="Интерфейс для операторов ресторана Babay Burger" />
    
    <!-- Предзагрузка шрифтов -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Мета-теги для мобильных устройств -->
    <meta name="theme-color" content="#1f2937" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Open Graph теги -->
    <meta property="og:title" content="Babay Burger - Операторский интерфейс" />
    <meta property="og:description" content="Интерфейс для операторов ресторана Babay Burger" />
    <meta property="og:type" content="website" />
    
    <!-- Стили для загрузки -->
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #111827;
        color: #f9fafb;
      }
      
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
      }
      
      .loading-content {
        text-align: center;
        color: #f9fafb;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #374151;
        border-top: 4px solid #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .loading-title {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 10px;
      }
      
      .loading-subtitle {
        font-size: 16px;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Загрузочный экран -->
      <div class="loading">
        <div class="loading-content">
          <div class="loading-spinner"></div>
          <div class="loading-title">Babay Burger</div>
          <div class="loading-subtitle">Операторский интерфейс</div>
        </div>
      </div>
    </div>
    
    <!-- Скрипт для операторского интерфейса -->
    <script type="module" src="/src/operator-main.tsx"></script>
  </body>
</html>
