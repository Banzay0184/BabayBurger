<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logobabay.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Babay Burger - PWA</title>
    <meta name="description" content="Установка PWA для Babay Burger" />
    
    <!-- Современный шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Базовые стили -->
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
        color: #f9fafb;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .container {
        max-width: 600px;
        width: 100%;
        padding: 2rem;
        text-align: center;
      }
      
      .logo {
        width: 100px;
        height: 100px;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 2rem;
        font-size: 2.5rem;
        animation: pulse 2s infinite;
      }
      
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      
      h1 {
        font-size: 2.5rem;
        font-weight: 800;
        margin: 0 0 1rem 0;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      .subtitle {
        font-size: 1.2rem;
        color: #9ca3af;
        margin: 0 0 2rem 0;
      }
      
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin: 2rem 0;
      }
      
      .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid #374151;
        border-top: 2px solid #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .buttons {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin-top: 2rem;
      }
      
      .btn {
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        color: white;
        border: none;
        padding: 1rem 2rem;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
      }
      
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
      }
      
      .btn.cashier {
        background: linear-gradient(135deg, #f97316, #ea580c);
      }
      
      .btn.cashier:hover {
        box-shadow: 0 10px 20px rgba(249, 115, 22, 0.3);
      }
      
      @media (max-width: 768px) {
        .container {
          padding: 1rem;
        }
        
        h1 {
          font-size: 2rem;
        }
        
        .buttons {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">🍔</div>
      <h1>Babay Burger</h1>
      <p class="subtitle">Выберите интерфейс для установки PWA</p>
      
      <div class="loading">
        <div class="spinner"></div>
        <span>Загрузка...</span>
      </div>
      
      <div class="buttons">
        <a href="/operator.html" class="btn">👨‍💼 Оператор</a>
        <a href="/cashier.html" class="btn cashier">💰 Кассир</a>
      </div>
    </div>
    
    <script>
      // Автоматическое перенаправление через 3 секунды
      setTimeout(() => {
        // Можно добавить логику для автоматического выбора интерфейса
        // Например, на основе URL параметров или пользовательских предпочтений
        console.log('Автоматическое перенаправление...');
      }, 3000);
      
      // Проверяем, поддерживает ли браузер PWA
      if ('serviceWorker' in navigator) {
        console.log('✅ PWA поддерживается');
      } else {
        console.log('❌ PWA не поддерживается');
      }
    </script>
  </body>
</html>
