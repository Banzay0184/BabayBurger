<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logobabay.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Babay Burger - Кассир</title>
    <meta name="description" content="Интерфейс кассира для ресторана Babay Burger" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/cashier/manifest.json" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#f97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Babay Кассир" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#f97316" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Дополнительные мета-теги для планшетов -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-orientations" content="portrait landscape" />
    
    <!-- Android Chrome -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f97316" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#ea580c" />
    
    <!-- PWA Icons -->
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo.jpg" />
    <link rel="apple-touch-icon" sizes="512x512" href="/logo.jpg" />
    <link rel="icon" type="image/jpeg" sizes="192x192" href="/logo.jpg" />
    <link rel="icon" type="image/jpeg" sizes="512x512" href="/logo.jpg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logobabay.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logobabay.png" />
    
    <!-- Современный шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://babayburger.com/cashier" />
    <meta property="og:title" content="Babay Burger - Кассир" />
    <meta property="og:description" content="Интерфейс кассира для ресторана Babay Burger" />
    <meta property="og:image" content="https://babayburger.com/logo.jpg" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://babayburger.com/cashier" />
    <meta property="twitter:title" content="Babay Burger - Кассир" />
    <meta property="twitter:description" content="Интерфейс кассира для ресторана Babay Burger" />
    <meta property="twitter:image" content="https://babayburger.com/logo.jpg" />
    
    <style>
      /* Базовые стили для PWA */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      
      /* Офлайн индикатор */
      .offline-indicator {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: #dc2626;
        color: white;
        text-align: center;
        padding: 8px;
        font-size: 14px;
        font-weight: 500;
        z-index: 9999;
        transform: translateY(-100%);
        transition: transform 0.3s ease;
      }
      
      .offline-indicator.show {
        transform: translateY(0);
      }
      
      /* PWA Install Prompt */
      .pwa-install-prompt {
        position: fixed;
        bottom: 20px;
        left: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.9);
        color: white;
        padding: 16px;
        border-radius: 12px;
        backdrop-filter: blur(10px);
        z-index: 1000;
        display: none;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }
      
      .pwa-install-prompt.show {
        display: block;
      }
      
      .pwa-install-prompt button {
        background: #f97316;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        margin: 4px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      
      .pwa-install-prompt button:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Офлайн индикатор -->
    <div id="offline-indicator" class="offline-indicator">
      Нет подключения к интернету
    </div>
    
    <!-- PWA Install Prompt -->
    <div id="pwa-install-prompt" class="pwa-install-prompt">
      <div style="margin-bottom: 8px;">📱 Установить Babay Кассир</div>
      <div style="font-size: 12px; opacity: 0.9; margin-bottom: 12px;">Для удобной работы установите приложение</div>
      <button id="pwa-install-btn">Установить</button>
      <button id="pwa-dismiss-btn">Позже</button>
    </div>
    
    <!-- В продакшене этот скрипт будет заменен на собранный JS -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- PWA скрипты -->
    <script>
      console.log('💰 Cashier PWA: Initializing...');
      
      // Проверяем и обрабатываем конфликты с внешними библиотеками
      let tronWeb;
      
      // Предотвращаем конфликты с TronLink и TronWeb
      if (window.tronLink && window.tronLink.ready) {
        console.log('✅ TronLink detected and ready - using TronLink TronWeb instance');
        tronWeb = window.tronLink.tronWeb;
        // Предотвращаем перезапись TronWeb
        if (window.TronWeb && window.TronWeb !== tronWeb) {
          console.log('⚠️ Preventing TronWeb conflict - using TronLink instance');
        }
      } else if (window.TronWeb) {
        console.log('⚠️ TronWeb detected - this might be from browser extension');
        tronWeb = window.TronWeb;
        // Не перезаписываем существующий TronWeb
      } else {
        console.log('ℹ️ No TronWeb detected - application will work without TronWeb');
      }
      
      // Проверяем другие возможные конфликты
      if (window.ethereum) {
        console.log('⚠️ Ethereum provider detected');
      }
      
      if (window.bitcoin) {
        console.log('⚠️ Bitcoin provider detected');
      }
      
      // Предотвращаем конфликты с TronLink
      if (window.tronLink) {
        console.log('🔗 TronLink extension detected');
        // Не перезаписываем существующий TronLink
      }
      
      // Дополнительная защита от конфликтов
      if (window.tronLink && !window.tronLink.ready) {
        console.log('⏳ TronLink detected but not ready - waiting...');
        // Ждем готовности TronLink
        const checkTronLink = setInterval(() => {
          if (window.tronLink && window.tronLink.ready) {
            console.log('✅ TronLink is now ready');
            clearInterval(checkTronLink);
          }
        }, 1000);
        
        // Очищаем интервал через 10 секунд
        setTimeout(() => {
          clearInterval(checkTronLink);
        }, 10000);
      }
      
      // PWA Диагностика
      console.log('💰 PWA Diagnostics:');
      console.log('- User Agent:', navigator.userAgent);
      console.log('- HTTPS:', location.protocol === 'https:');
      console.log('- Service Worker Support:', 'serviceWorker' in navigator);
      console.log('- Manifest Support:', 'manifest' in document.createElement('link'));
      console.log('- Current URL:', location.href);
      console.log('- Display Mode:', window.matchMedia('(display-mode: standalone)').matches ? 'standalone' : 'browser');
      console.log('- Is Mobile:', /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent));
      console.log('- Is Tablet:', /iPad|Android.*(?=.*Tablet)|Android.*(?=.*Tab)/i.test(navigator.userAgent));
      console.log('- Screen Size:', window.screen.width + 'x' + window.screen.height);
      console.log('- Viewport Size:', window.innerWidth + 'x' + window.innerHeight);
      console.log('- Is Telegram WebApp:', !!(window.Telegram && window.Telegram.WebApp));
      console.log('- In iframe/WebView:', window.self !== window.top);
      
      // Проверяем манифест
      fetch('/cashier/manifest.json')
        .then(response => response.json())
        .then(manifest => {
          console.log('💰 PWA: Manifest loaded successfully:', manifest);
        })
        .catch(error => {
          console.error('💰 PWA: Manifest loading failed:', error);
        });
      
      // Проверка на Telegram WebApp
      const isTelegramWebApp = !!(window.Telegram && window.Telegram.WebApp);
      const isInWebView = window.self !== window.top;
      
      console.log('🔍 TELEGRAM DETECTION:');
      console.log('- window.Telegram exists:', !!window.Telegram);
      console.log('- window.Telegram.WebApp exists:', !!(window.Telegram && window.Telegram.WebApp));
      console.log('- isTelegramWebApp:', isTelegramWebApp);
      console.log('- isInWebView:', isInWebView);
      console.log('- window.self !== window.top:', window.self !== window.top);
      
      if (isTelegramWebApp || isInWebView) {
        console.warn('🚨 PWA НЕ РАБОТАЕТ В TELEGRAM WEBAPP ИЛИ WEBVIEW!');
        console.log('📱 ДЛЯ УСТАНОВКИ PWA ОТКРОЙТЕ ССЫЛКУ В ОБЫЧНОМ БРАУЗЕРЕ');
        console.log('🔗 Скопируйте ссылку:', window.location.href);
        
        // Показываем предупреждение
        setTimeout(() => {
          console.log('⚠️ Показываем предупреждение о Telegram WebApp...');
          showTelegramWarning();
        }, 1000);
      } else {
        console.log('✅ НЕ TELEGRAM WEBAPP - PWA МОЖЕТ РАБОТАТЬ');
      }
      
      // Переменные для PWA
      let deferredPrompt = null;
      let isInstalled = false;
      
      // Проверка статуса подключения
      function updateOnlineStatus() {
        const indicator = document.getElementById('offline-indicator');
        if (navigator.onLine) {
          indicator.classList.remove('show');
        } else {
          indicator.classList.add('show');
        }
      }

      // Слушатели событий для статуса сети
      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);
      updateOnlineStatus();

      // PWA Install Events
      window.addEventListener('beforeinstallprompt', (e) => {
        console.log('💰 PWA: beforeinstallprompt fired');
        console.log('💰 PWA: Event details:', e);
        console.log('💰 PWA: Platforms:', e.platforms);
        
        // Предотвращаем автоматический показ баннера
        e.preventDefault();
        console.log('💰 PWA: Banner prevented - will show custom prompt');
        
        // Сохраняем событие для показа позже
        deferredPrompt = e;
        
        // Показываем наш кастомный промпт
        setTimeout(() => {
          showInstallPrompt();
        }, 3000);
      });

      // Обработка установки
      window.addEventListener('appinstalled', () => {
        console.log('💰 PWA: App installed successfully');
        isInstalled = true;
        hideInstallPrompt();
      });

      // Функция показа промпта установки
      function showInstallPrompt() {
        if (isInstalled) return;
        
        const prompt = document.getElementById('pwa-install-prompt');
        if (prompt) {
          prompt.classList.add('show');
          
          // Обработчики кнопок
          const installBtn = document.getElementById('pwa-install-btn');
          const dismissBtn = document.getElementById('pwa-dismiss-btn');
          
          if (installBtn) {
            installBtn.onclick = () => {
              if (deferredPrompt) {
                console.log('💰 PWA: Calling deferredPrompt.prompt()');
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                  console.log('💰 PWA: User choice:', choiceResult.outcome);
                  if (choiceResult.outcome === 'accepted') {
                    console.log('💰 PWA: User accepted the install prompt');
                  } else {
                    console.log('💰 PWA: User dismissed the install prompt');
                  }
                  deferredPrompt = null;
                }).catch((error) => {
                  console.error('💰 PWA: Error during user choice:', error);
                  deferredPrompt = null;
                });
              } else {
                console.log('💰 PWA: No deferredPrompt available, showing manual instructions');
                showManualInstallInstructions();
              }
              hideInstallPrompt();
            };
          }
          
          if (dismissBtn) {
            dismissBtn.onclick = () => {
              hideInstallPrompt();
            };
          }
        }
      }

      // Функция скрытия промпта
      function hideInstallPrompt() {
        const prompt = document.getElementById('pwa-install-prompt');
        if (prompt) {
          prompt.classList.remove('show');
        }
      }

      // Функция показа инструкций по ручной установке
      function showManualInstallInstructions() {
        const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const isChrome = /Chrome/i.test(navigator.userAgent);
        const isSafari = /Safari/i.test(navigator.userAgent) && !/Chrome/i.test(navigator.userAgent);
        
        let instructions = '';
        
        if (isMobile) {
          if (isChrome) {
            instructions = `
📱 Установка PWA на мобильном устройстве (Chrome):

1. Нажмите на меню браузера (⋮)
2. Найдите "Добавить на главный экран" или "Установить приложение"
3. Подтвердите установку

Альтернативно:
1. Откройте в Chrome
2. Найдите кнопку "Добавить на главный экран"
3. Подтвердите установку
            `;
          } else if (isSafari) {
            instructions = `
📱 Установка PWA на iOS (Safari):

1. Нажмите кнопку "Поделиться" (квадрат со стрелкой)
2. Выберите "На экран Домой"
3. Подтвердите установку
            `;
          } else {
            instructions = `
📱 Установка PWA на мобильном устройстве:

1. Откройте в Chrome
2. Найдите кнопку "Добавить на главный экран"
3. Подтвердите установку
            `;
          }
        } else {
          if (isChrome) {
            instructions = `
💻 Установка PWA на компьютере (Chrome):

1. Нажмите на иконку ⊕ в адресной строке
2. Или: Меню (⋮) → "Установить Babay Кассир"  
3. Подтвердите установку

Если иконки нет:
- Попробуйте обновить страницу
- Или откройте в режиме инкогнито
- Проверьте DevTools > Application > Manifest
            `;
          } else {
            instructions = 'Для установки PWA рекомендуется использовать Chrome или Edge браузер';
          }
        }
        
        alert(instructions.trim());
      }

      // Функция показа предупреждения о Telegram
      function showTelegramWarning() {
        const warning = document.createElement('div');
        warning.style.cssText = `
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          background: rgba(0, 0, 0, 0.9);
          color: white;
          padding: 20px;
          border-radius: 12px;
          text-align: center;
          z-index: 10000;
          max-width: 90%;
          backdrop-filter: blur(10px);
        `;
        
        warning.innerHTML = `
          <h3 style="margin-bottom: 12px; color: #f97316;">⚠️ Telegram WebApp</h3>
          <p style="margin-bottom: 16px;">PWA не работает в Telegram WebApp</p>
          <p style="margin-bottom: 16px; font-size: 14px; opacity: 0.9;">Для установки приложения откройте ссылку в обычном браузере</p>
          <button onclick="this.parentElement.remove()" style="
            background: #f97316;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
          ">Понятно</button>
        `;
        
        document.body.appendChild(warning);
        
        // Автоматически скрываем через 10 секунд
        setTimeout(() => {
          if (warning.parentNode) {
            warning.parentNode.removeChild(warning);
          }
        }, 10000);
      }

      // Проверка критериев установки
      function checkInstallCriteria() {
        console.log('💰 PWA: Install criteria check:');
        
        // Проверяем Service Worker
        const hasServiceWorker = 'serviceWorker' in navigator;
        console.log('- Service Worker registered:', hasServiceWorker);
        
        // Проверяем манифест
        const manifestLink = document.querySelector('link[rel="manifest"]');
        const hasManifest = !!manifestLink;
        console.log('- Manifest linked:', hasManifest);
        
        // Проверяем HTTPS
        const isSecure = location.protocol === 'https:' || location.hostname === 'localhost';
        console.log('- HTTPS or localhost:', isSecure);
        
        // Проверяем иконки
        const hasIcons = document.querySelectorAll('link[rel*="icon"], link[rel*="apple-touch-icon"]').length > 0;
        console.log('- Has icons:', hasIcons);
        
        return hasServiceWorker && hasManifest && isSecure && hasIcons;
      }

      // Регистрация Service Worker
      if ('serviceWorker' in navigator) {
        console.log('💰 PWA: Registering Service Worker...');
        
        navigator.serviceWorker.register('/cashier/sw.js')
          .then((registration) => {
            console.log('💰 PWA: Service Worker registered successfully:', registration);
            console.log('💰 PWA: Registration scope:', registration.scope);
            console.log('💰 PWA: Registration state:', registration.active ? 'installed' : 'installing');
            
            // Проверяем состояние Service Worker
            if (registration.active) {
              console.log('💰 PWA: Service Worker is ready and active');
            } else if (registration.installing) {
              console.log('💰 PWA: Service Worker is installing...');
              registration.installing.addEventListener('statechange', () => {
                if (registration.installing.state === 'activated') {
                  console.log('💰 PWA: Service Worker activated');
                }
              });
            }
          })
          .catch((error) => {
            console.error('💰 PWA: Service Worker registration failed:', error);
          });
      }

      // Проверяем критерии установки после загрузки DOM
      document.addEventListener('DOMContentLoaded', () => {
        console.log('💰 PWA: DOM loaded, checking install criteria...');
        checkInstallCriteria();
      });

      // Функция принудительной установки (для тестирования)
      function addForceInstallButton() {
        if (isInstalled) return;
        
        const button = document.createElement('button');
        button.textContent = '🔧 Принудительная установка';
        button.style.cssText = `
          position: fixed;
          bottom: 80px;
          right: 20px;
          background: rgba(0, 0, 0, 0.8);
          color: white;
          border: none;
          padding: 8px 12px;
          border-radius: 6px;
          font-size: 12px;
          cursor: pointer;
          z-index: 1000;
          backdrop-filter: blur(10px);
        `;
        
        button.onclick = () => {
          let instructions = '';
          
          const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
          const isChrome = /Chrome/i.test(navigator.userAgent);
          
          if (isMobile) {
            if (isChrome) {
              instructions = `
📱 Установка PWA на мобильном устройстве (Chrome):

1. Откройте в Chrome
2. Найдите кнопку "Добавить на главный экран"
3. Подтвердите установку
              `;
            }
          } else {
            if (isChrome) {
              instructions = `
💻 Установка PWA на компьютере (Chrome):

1. Нажмите на иконку ⊕ в адресной строке
2. Или: Меню (⋮) → "Установить Babay Кассир"  
3. Подтвердите установку

Если иконки нет:
- Попробуйте обновить страницу
- Или откройте в режиме инкогнито
- Проверьте DevTools > Application > Manifest
              `;
            } else {
              instructions = 'Для установки PWA рекомендуется использовать Chrome или Edge браузер';
            }
          }
          
          alert(instructions.trim());
        };
        
        document.body.appendChild(button);
        
        // Скрываем кнопку через 30 секунд
        setTimeout(() => {
          if (button.parentNode) {
            button.parentNode.removeChild(button);
          }
        }, 30000);
      }

      // Добавляем кнопку через 2 секунды
      setTimeout(addForceInstallButton, 2000);

      // Загружаем тестовый скрипт для отладки (только в dev режиме)
      if (location.hostname === 'localhost') {
        const script = document.createElement('script');
        script.src = '/pwa-test.js';
        document.head.appendChild(script);
        console.log('🧪 PWA Test script loaded. Use testPWA() in console for diagnostics.');
      }
      
      // Определяем режим работы
      if (isTelegramWebApp || isInWebView) {
        console.log('💰 PWA: Running in Telegram WebApp/WebView - PWA features disabled');
      } else {
        console.log('💰 PWA: Running in browser');
      }
      
      console.log('💰 Cashier PWA: Initialized successfully');
    </script>
  </body>
</html>
