<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logobabay.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Babay Burger - Кассир</title>
    <meta name="description" content="Интерфейс кассира для ресторана Babay Burger" />
    
    <!-- PWA Manifest для кассира -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#f97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Babay Кассир" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#f97316" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- PWA Icons -->
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <link rel="icon" type="image/jpeg" sizes="192x192" href="/logo.jpg" />
    <link rel="icon" type="image/jpeg" sizes="512x512" href="/logo.jpg" />
    
    <!-- Современный шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://babayburger.com/cashier" />
    <meta property="og:title" content="Babay Burger - Кассир" />
    <meta property="og:description" content="Интерфейс кассира для ресторана Babay Burger" />
    <meta property="og:image" content="https://babayburger.com/logo.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://babayburger.com/cashier" />
    <meta property="twitter:title" content="Babay Burger - Кассир" />
    <meta property="twitter:description" content="Интерфейс кассира для ресторана Babay Burger" />
    <meta property="twitter:image" content="https://babayburger.com/logo.jpg" />
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Yandex Maps API -->
    <script src="https://api-maps.yandex.ru/2.1/?apikey=3033f881-c5ec-434f-96aa-e13da893f61f&lang=ru_RU" type="text/javascript"></script>
    <script>
      // Отладка загрузки Яндекс.Карт API
      console.log('HTML loaded, checking Yandex Maps API...');
      
      function checkYandexMaps() {
        if (typeof window.ymaps !== 'undefined') {
          console.log('✅ Yandex Maps API loaded successfully!');
          console.log('window.ymaps:', window.ymaps);
          console.log('window.ymaps.ready:', typeof window.ymaps.ready);
        } else {
          console.log('❌ Yandex Maps API not loaded yet...');
          setTimeout(checkYandexMaps, 100);
        }
      }
      
      // Проверяем каждые 100мс
      checkYandexMaps();
      
      // Также проверяем через 2 секунды
      setTimeout(() => {
        if (typeof window.ymaps === 'undefined') {
          console.error('❌ Yandex Maps API failed to load after 2 seconds!');
        }
      }, 2000);
    </script>
    
    <!-- Telegram Web App мета-теги (удалены дублирующиеся PWA теги) -->
    
    <!-- Базовые стили -->
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f8fafc;
        color: #1f2937;
      }
      
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Стили для PWA */
      @media (display-mode: standalone) {
        body {
          background-color: #f8fafc;
        }
      }

      /* Стили для офлайн режима */
      .offline-indicator {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background-color: #dc2626;
        color: white;
        text-align: center;
        padding: 8px;
        font-size: 14px;
        z-index: 9999;
        display: none;
      }

      .offline-indicator.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Индикатор офлайн режима -->
    <div id="offline-indicator" class="offline-indicator">
      📱 Приложение работает в офлайн режиме
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Простой тест -->
    <script>
      console.log('🧪 Тестовый скрипт загружен!');
    </script>
    
    <!-- PWA скрипт -->
    <script>
      console.log('🚀 PWA скрипт начал выполнение!');
      
      // Ждем загрузки DOM
      document.addEventListener('DOMContentLoaded', function() {
        console.log('📄 DOM загружен, запускаем PWA диагностику!');
        
      // Проверка офлайн режима
      function updateOnlineStatus() {
        const indicator = document.getElementById('offline-indicator');
        if (navigator.onLine) {
          indicator.classList.remove('show');
        } else {
          indicator.classList.add('show');
        }
      }

      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);
      
      // Проверяем статус при загрузке
      updateOnlineStatus();

      // Регистрируем Service Worker для кассира
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('✅ Cashier Service Worker зарегистрирован:', registration);
              console.log('📱 PWA готов к установке');
            })
            .catch((error) => {
              console.error('❌ Ошибка регистрации Cashier Service Worker:', error);
            });
        });
      } else {
        console.log('❌ Service Worker не поддерживается');
      }

      // Проверяем PWA критерии
      function checkPWACriteria() {
        try {
          console.log('🔍 Проверка PWA критериев:');
          console.log('- HTTPS:', location.protocol === 'https:' || location.hostname === 'localhost');
          console.log('- Service Worker:', 'serviceWorker' in navigator);
          console.log('- Manifest:', document.querySelector('link[rel="manifest"]') !== null);
          console.log('- Icons:', document.querySelectorAll('link[rel="icon"]').length > 0);
          console.log('- Start URL:', '/cashier/login');
          console.log('- Scope:', '/cashier');
        
        // Проверяем манифест
        const manifestLink = document.querySelector('link[rel="manifest"]');
        if (manifestLink) {
          fetch(manifestLink.href)
            .then(response => response.json())
            .then(manifest => {
              console.log('📱 Манифест загружен:', manifest);
              console.log('- Иконки в манифесте:', manifest.icons?.length || 0);
              console.log('- Start URL в манифесте:', manifest.start_url);
              console.log('- Scope в манифесте:', manifest.scope);
            })
            .catch(error => {
              console.error('❌ Ошибка загрузки манифеста:', error);
            });
        }
        
        // Проверяем Service Worker
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            console.log('🔧 Зарегистрированные Service Workers:', registrations.length);
            registrations.forEach((registration, index) => {
              console.log(`- SW ${index + 1}:`, registration.scope, registration.active?.scriptURL);
              console.log(`- SW ${index + 1} состояние:`, registration.active?.state);
            });
          });
          
          // Проверяем контроллер
          if (navigator.serviceWorker.controller) {
            console.log('✅ Service Worker контроллер активен:', navigator.serviceWorker.controller.scriptURL);
          } else {
            console.log('❌ Service Worker контроллер не активен');
          }
        }
        } catch (error) {
          console.error('❌ Ошибка в checkPWACriteria:', error);
        }
      }

      // Простая проверка сразу
      try {
        console.log('🚀 PWA диагностика запущена');
        
        // Проверяем манифест сразу
        fetch('/manifest.json')
          .then(response => {
            console.log('📱 Манифест ответ:', response.status, response.statusText);
            return response.json();
          })
          .then(manifest => {
            console.log('📱 Манифест загружен:', manifest);
          })
          .catch(error => {
            console.error('❌ Ошибка загрузки манифеста:', error);
          });
      } catch (error) {
        console.error('❌ Ошибка в PWA диагностике:', error);
      }
      
      // Проверяем при загрузке
      setTimeout(checkPWACriteria, 1000);
      
      // Дополнительная проверка через 3 секунды
      setTimeout(checkPWACriteria, 3000);

      // Отладка beforeinstallprompt
      let deferredPrompt = null;
      
      try {
        console.log('📱 Ожидаем событие beforeinstallprompt...');
        
        window.addEventListener('beforeinstallprompt', (e) => {
        console.log('🎉 beforeinstallprompt событие получено!');
        console.log('Event:', e);
        e.preventDefault();
        deferredPrompt = e;
        
        // Показываем кнопку установки
        const installButton = document.createElement('button');
        installButton.textContent = 'Установить PWA';
        installButton.style.cssText = `
          position: fixed;
          bottom: 20px;
          left: 20px;
          z-index: 1000;
          background: #f97316;
          color: white;
          border: none;
          padding: 10px 20px;
          border-radius: 5px;
          cursor: pointer;
          font-size: 14px;
        `;
        
        installButton.addEventListener('click', async () => {
          if (deferredPrompt) {
            console.log('🚀 Показываем prompt установки...');
            await deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log('📱 Результат установки:', outcome);
            deferredPrompt = null;
            installButton.remove();
          }
        });
        
        document.body.appendChild(installButton);
      });

        window.addEventListener('appinstalled', () => {
          console.log('✅ PWA установлено успешно!');
          deferredPrompt = null;
        });
      } catch (error) {
        console.error('❌ Ошибка в обработчиках событий:', error);
      }

      // Проверяем критерии PWA через 5 секунд
      setTimeout(() => {
        try {
          console.log('🔍 Финальная проверка PWA критериев:');
          console.log('- User Agent:', navigator.userAgent);
          console.log('- Platform:', navigator.platform);
          console.log('- Standalone:', window.matchMedia('(display-mode: standalone)').matches);
          console.log('- iOS Standalone:', window.navigator.standalone);
          console.log('- Deferred Prompt:', !!deferredPrompt);
          console.log('- URL:', window.location.href);
          console.log('- Protocol:', window.location.protocol);
          console.log('- Hostname:', window.location.hostname);
        
        // Проверяем манифест еще раз
        fetch('/manifest.json')
          .then(response => response.json())
          .then(manifest => {
            console.log('📱 Финальная проверка манифеста:', manifest);
            
            // Проверяем каждое поле манифеста
            const requiredFields = ['name', 'short_name', 'start_url', 'display', 'icons'];
            requiredFields.forEach(field => {
              if (!manifest[field]) {
                console.error(`❌ Отсутствует обязательное поле: ${field}`);
              } else {
                console.log(`✅ Поле ${field}:`, manifest[field]);
              }
            });
            
            // Проверяем иконки
            if (manifest.icons && manifest.icons.length > 0) {
              manifest.icons.forEach((icon, index) => {
                console.log(`📱 Иконка ${index + 1}:`, icon);
                
                // Проверяем доступность иконки
                fetch(icon.src)
                  .then(response => {
                    if (response.ok) {
                      console.log(`✅ Иконка ${index + 1} доступна:`, icon.src);
                    } else {
                      console.error(`❌ Иконка ${index + 1} недоступна:`, icon.src, response.status);
                    }
                  })
                  .catch(error => {
                    console.error(`❌ Ошибка загрузки иконки ${index + 1}:`, icon.src, error);
                  });
              });
            } else {
              console.error('❌ Нет иконок в манифесте!');
            }
          })
          .catch(error => {
            console.error('❌ Ошибка загрузки манифеста:', error);
          });
        } catch (error) {
          console.error('❌ Ошибка в финальной проверке:', error);
        }
      }, 5000);
      
      // Дополнительная проверка через 10 секунд
      setTimeout(() => {
        try {
          console.log('🔍 Проверка через 10 секунд:');
          console.log('- Deferred Prompt:', !!deferredPrompt);
          console.log('- PWA установлена:', window.matchMedia('(display-mode: standalone)').matches);
          
          if (!deferredPrompt) {
            console.log('❌ beforeinstallprompt не сработал. Возможные причины:');
            console.log('1. PWA уже установлена');
            console.log('2. Браузер не поддерживает PWA');
            console.log('3. Не выполнены критерии PWA');
            console.log('4. Проблемы с манифестом или иконками');
          }
        } catch (error) {
          console.error('❌ Ошибка в проверке через 10 секунд:', error);
        }
      }, 10000);
      
      console.log('✅ PWA скрипт завершил выполнение!');
      }); // Закрываем DOMContentLoaded
    </script>
  </body>
</html>
