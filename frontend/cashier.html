<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logobabay.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Babay Burger - Кассир</title>
    <meta name="description" content="Интерфейс кассира для ресторана Babay Burger" />
    
    <!-- PWA Manifest для кассира -->
    <link rel="manifest" href="/cashier-manifest.json" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#f97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Babay Кассир" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#f97316" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- PWA Icons -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    
    <!-- Современный шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://babayburger.com/cashier" />
    <meta property="og:title" content="Babay Burger - Кассир" />
    <meta property="og:description" content="Интерфейс кассира для ресторана Babay Burger" />
    <meta property="og:image" content="https://babayburger.com/logo.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://babayburger.com/cashier" />
    <meta property="twitter:title" content="Babay Burger - Кассир" />
    <meta property="twitter:description" content="Интерфейс кассира для ресторана Babay Burger" />
    <meta property="twitter:image" content="https://babayburger.com/logo.jpg" />
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Yandex Maps API -->
    <script src="https://api-maps.yandex.ru/2.1/?apikey=3033f881-c5ec-434f-96aa-e13da893f61f&lang=ru_RU" type="text/javascript"></script>
    <script>
      // Отладка загрузки Яндекс.Карт API
      console.log('HTML loaded, checking Yandex Maps API...');
      
      function checkYandexMaps() {
        if (typeof window.ymaps !== 'undefined') {
          console.log('✅ Yandex Maps API loaded successfully!');
          console.log('window.ymaps:', window.ymaps);
          console.log('window.ymaps.ready:', typeof window.ymaps.ready);
        } else {
          console.log('❌ Yandex Maps API not loaded yet...');
          setTimeout(checkYandexMaps, 100);
        }
      }
      
      // Проверяем каждые 100мс
      checkYandexMaps();
      
      // Также проверяем через 2 секунды
      setTimeout(() => {
        if (typeof window.ymaps === 'undefined') {
          console.error('❌ Yandex Maps API failed to load after 2 seconds!');
        }
      }, 2000);
    </script>
    
    <!-- Telegram Web App мета-теги (удалены дублирующиеся PWA теги) -->
    
    <!-- Базовые стили -->
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f8fafc;
        color: #1f2937;
      }
      
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Стили для PWA */
      @media (display-mode: standalone) {
        body {
          background-color: #f8fafc;
        }
      }

      /* Стили для офлайн режима */
      .offline-indicator {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background-color: #dc2626;
        color: white;
        text-align: center;
        padding: 8px;
        font-size: 14px;
        z-index: 9999;
        display: none;
      }

      .offline-indicator.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Индикатор офлайн режима -->
    <div id="offline-indicator" class="offline-indicator">
      📱 Приложение работает в офлайн режиме
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Простой тест -->
    <script>
      console.log('🧪 Тестовый скрипт загружен!');
    </script>
    
    <!-- PWA скрипт -->
    <script>
      // Проверка офлайн режима
      function updateOnlineStatus() {
        const indicator = document.getElementById('offline-indicator');
        if (navigator.onLine) {
          indicator.classList.remove('show');
        } else {
          indicator.classList.add('show');
        }
      }

      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);
      
      // Проверяем статус при загрузке
      updateOnlineStatus();

      // Регистрируем Service Worker для кассира
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/cashier-sw.js')
            .then((registration) => {
              console.log('✅ Cashier Service Worker зарегистрирован:', registration);
              
              // Проверяем PWA критерии
              setTimeout(() => {
                console.log('🔍 PWA Критерии:');
                console.log('- HTTPS:', location.protocol === 'https:' || location.hostname === 'localhost');
                console.log('- Service Worker:', !!navigator.serviceWorker.controller);
                console.log('- Manifest:', !!document.querySelector('link[rel="manifest"]'));
                console.log('- Icons:', document.querySelectorAll('link[rel="icon"]').length > 0);
                
                // Проверяем манифест
                fetch('/cashier-manifest.json')
                  .then(response => response.json())
                  .then(manifest => {
                    console.log('📱 Манифест:', manifest);
                    console.log('- Иконки:', manifest.icons?.length || 0);
                    console.log('- Start URL:', manifest.start_url);
                  })
                  .catch(error => {
                    console.error('❌ Ошибка манифеста:', error);
                  });
              }, 1000);
            })
            .catch((error) => {
              console.error('❌ Ошибка регистрации Cashier Service Worker:', error);
            });
        });
      } else {
        console.log('❌ Service Worker не поддерживается');
      }
    </script>
  </body>
</html>
