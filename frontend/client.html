    <script>
      // Отладка загрузки Яндекс.Карт API
      console.log('HTML loaded, checking Yandex Maps API...');
      
      function checkYandexMaps() {
        if (typeof window.ymaps !== 'undefined') {
          console.log('✅ Yandex Maps API loaded successfully!');
          console.log('window.ymaps:', window.ymaps);
          console.log('window.ymaps.ready:', typeof window.ymaps.ready);
        } else {
          console.log('❌ Yandex Maps API not loaded yet...');
          setTimeout(checkYandexMaps, 100);
        }
      }
      
      // Проверяем каждые 100мс
      checkYandexMaps();
      
      // Также проверяем через 2 секунды
      setTimeout(() => {
        if (typeof window.ymaps === 'undefined') {
          console.error('❌ Yandex Maps API failed to load after 2 seconds!');
        }
      }, 2000);
    </script>

      }

      /* Стили для PWA */
      @media (display-mode: standalone) {
        body {
          background-color: #f8fafc;
        }
      }

      /* Стили для офлайн режима */
      .offline-indicator {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background-color: #dc2626;
        color: white;
        text-align: center;
        padding: 8px;
        font-size: 14px;
        z-index: 9999;
        display: none;
      }

      .offline-indicator.show {
        display: block;
      }
    </style>

  <body>
    <div id="root"></div>
    
    <!-- Индикатор офлайн режима -->
    <div id="offline-indicator" class="offline-indicator">
      📱 Приложение работает в офлайн режиме
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- PWA скрипт -->
    <script>
      // Проверка офлайн режима
      function updateOnlineStatus() {
        const indicator = document.getElementById('offline-indicator');
        if (navigator.onLine) {
          indicator.classList.remove('show');
        } else {
          indicator.classList.add('show');
        }
      }

      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);
      
      // Проверяем статус при загрузке
      updateOnlineStatus();
