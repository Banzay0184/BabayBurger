<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Babay Food - Доставка еды</title>
    <meta name="description" content="Доставка вкусной еды в Бухаре и Кагане. Babay Food - быстро, вкусно, удобно!" />
    
    <meta name="msapplication-TileColor" content="#f97316" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Icons -->
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <link rel="icon" type="image/jpeg" sizes="192x192" href="/logo.jpg" />
    <link rel="icon" type="image/jpeg" sizes="512x512" href="/logo.jpg" />
    
    <!-- Современный шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://babayburger.com/" />
    <meta property="og:title" content="Babay Food - Доставка еды" />
    <meta property="og:description" content="Доставка вкусных бургеров в Бухаре и Кагане. Быстро, вкусно, удобно!" />
    <meta property="og:image" content="https://babayburger.com/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://babayburger.com/" />
    <meta property="twitter:title" content="Babay Food - Доставка еды" />
    <meta property="twitter:description" content="Доставка вкусных бургеров в Бухаре и Кагане. Быстро, вкусно, удобно!" />
    <meta property="twitter:image" content="https://babayburger.com/og-image.jpg" />
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Yandex Maps API -->
    <script src="https://api-maps.yandex.ru/2.1/?apikey=3033f881-c5ec-434f-96aa-e13da893f61f&lang=ru_RU" type="text/javascript"></script>
    <script>
      // Отладка загрузки Яндекс.Карт API
      console.log('HTML loaded, checking Yandex Maps API...');
      
      function checkYandexMaps() {
        if (typeof window.ymaps !== 'undefined') {
          console.log('✅ Yandex Maps API loaded successfully!');
          console.log('window.ymaps:', window.ymaps);
          console.log('window.ymaps.ready:', typeof window.ymaps.ready);
        } else {
          console.log('❌ Yandex Maps API not loaded yet...');
          setTimeout(checkYandexMaps, 100);
        }
      }
      
      // Проверяем каждые 100мс
      checkYandexMaps();
      
      // Также проверяем через 2 секунды
      setTimeout(() => {
        if (typeof window.ymaps === 'undefined') {
          console.error('❌ Yandex Maps API failed to load after 2 seconds!');
        }
      }, 2000);
    </script>
    
    
    <!-- Базовые стили -->
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f8fafc;
        color: #1f2937;
      }
      
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }


    </style>
  </head>
  <body>
    <div id="root"></div>
    
    
    <script type="module" src="/src/main.tsx"></script>
    
  </body>
</html>
