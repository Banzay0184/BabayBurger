    <!-- Базовые стили -->
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f8fafc;
        color: #1f2937;
      }
      
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* PWA стили */
      @media (display-mode: standalone) {
        body {
          background-color: #f8fafc;
          user-select: none;
        }
        
        /* Скрываем полосы прокрутки в standalone режиме */
        ::-webkit-scrollbar {
          width: 6px;
        }
        
        ::-webkit-scrollbar-track {
          background: #f1f1f1;
        }
        
        ::-webkit-scrollbar-thumb {
          background: #c1c1c1;
          border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
          background: #a8a8a8;
        }
      }

      /* Стили для офлайн индикатора */
      .offline-indicator {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: linear-gradient(135deg, #dc2626, #b91c1c);
        color: white;
        text-align: center;
        padding: 12px;
        font-size: 14px;
        font-weight: 600;
        z-index: 9999;
        transform: translateY(-100%);
        transition: transform 0.3s ease-in-out;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }

      .offline-indicator.show {
        transform: translateY(0);
      }

      .offline-indicator::before {
        content: '📶';
        margin-right: 8px;
      }

      /* PWA install prompt стили */
      .pwa-install-prompt {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(135deg, #f97316, #ea580c);
        color: white;
        padding: 16px 24px;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(249, 115, 22, 0.3);
        z-index: 9998;
        max-width: 90%;
        text-align: center;
        opacity: 0;
        transform: translateX(-50%) translateY(100%);
        transition: all 0.3s ease-in-out;
      }

      .pwa-install-prompt.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .pwa-install-prompt button {
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
        padding: 8px 16px;
        border-radius: 6px;
        margin: 0 4px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s ease;
      }

      .pwa-install-prompt button:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: translateY(-1px);
      }

    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Офлайн индикатор -->
    <div id="offline-indicator" class="offline-indicator">
      Нет подключения к интернету
    </div>
    
    <!-- PWA Install Prompt -->
    <div id="pwa-install-prompt" class="pwa-install-prompt">
      <div style="margin-bottom: 8px;">📱 Установить Babay Кассир</div>
      <div style="font-size: 12px; opacity: 0.9; margin-bottom: 12px;">Для удобной работы установите приложение</div>
      <button id="pwa-install-btn">Установить</button>
      <button id="pwa-dismiss-btn">Позже</button>
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- PWA скрипты -->
    <script>
      console.log('💰 Cashier PWA: Initializing...');
      
      // Проверяем и обрабатываем конфликты с внешними библиотеками
      let tronWeb;
      
      // Предотвращаем конфликты с TronLink и TronWeb
      if (window.tronLink && window.tronLink.ready) {
        console.log('✅ TronLink detected and ready - using TronLink TronWeb instance');
        tronWeb = window.tronLink.tronWeb;
        // Предотвращаем перезапись TronWeb
        if (window.TronWeb && window.TronWeb !== tronWeb) {
          console.log('⚠️ Preventing TronWeb conflict - using TronLink instance');
        }
      } else if (window.TronWeb) {
        console.log('⚠️ TronWeb detected - this might be from browser extension');
        tronWeb = window.TronWeb;
        // Не перезаписываем существующий TronWeb
      } else {
        console.log('ℹ️ No TronWeb detected - application will work without TronWeb');
      }
      
      // Проверяем другие возможные конфликты
      if (window.ethereum) {
        console.log('⚠️ Ethereum provider detected');
      }
      
      if (window.bitcoin) {
        console.log('⚠️ Bitcoin provider detected');
      }
      
      // Предотвращаем конфликты с TronLink
      if (window.tronLink) {
        console.log('🔗 TronLink extension detected');
        // Не перезаписываем существующий TronLink
      }
      
      // Дополнительная защита от конфликтов
      if (window.tronLink && !window.tronLink.ready) {
        console.log('⏳ TronLink detected but not ready - waiting...');
        // Ждем готовности TronLink
        const checkTronLink = setInterval(() => {
          if (window.tronLink && window.tronLink.ready) {
            console.log('✅ TronLink is now ready');
            clearInterval(checkTronLink);
          }
        }, 1000);
        
        // Очищаем интервал через 10 секунд
        setTimeout(() => {
          clearInterval(checkTronLink);
        }, 10000);
      }
      
      // PWA Диагностика
      console.log('💰 PWA Diagnostics:');
      console.log('- User Agent:', navigator.userAgent);
      console.log('- HTTPS:', location.protocol === 'https:');
      console.log('- Service Worker Support:', 'serviceWorker' in navigator);
      console.log('- Manifest Support:', 'manifest' in document.createElement('link'));
      console.log('- Current URL:', location.href);
      console.log('- Display Mode:', window.matchMedia('(display-mode: standalone)').matches ? 'standalone' : 'browser');
      console.log('- Is Mobile:', /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent));
      console.log('- Is Tablet:', /iPad|Android.*(?=.*Tablet)|Android.*(?=.*Tab)/i.test(navigator.userAgent));
      console.log('- Screen Size:', window.screen.width + 'x' + window.screen.height);
      console.log('- Viewport Size:', window.innerWidth + 'x' + window.innerHeight);
      console.log('- Is Telegram WebApp:', !!(window.Telegram && window.Telegram.WebApp));
      console.log('- In iframe/WebView:', window.self !== window.top);
      
      // Проверяем манифест
      fetch('/cashier/manifest.json')
        .then(response => response.json())
        .then(manifest => {
          console.log('💰 PWA: Manifest loaded successfully:', manifest);
        })
        .catch(error => {
          console.error('💰 PWA: Manifest loading failed:', error);
        });
      
      // Проверка на Telegram WebApp
      const isTelegramWebApp = !!(window.Telegram && window.Telegram.WebApp);
      const isInWebView = window.self !== window.top;
      
      console.log('🔍 TELEGRAM DETECTION:');
      console.log('- window.Telegram exists:', !!window.Telegram);
      console.log('- window.Telegram.WebApp exists:', !!(window.Telegram && window.Telegram.WebApp));
      console.log('- isTelegramWebApp:', isTelegramWebApp);
      console.log('- isInWebView:', isInWebView);
      console.log('- window.self !== window.top:', window.self !== window.top);
      
      if (isTelegramWebApp || isInWebView) {
        console.warn('🚨 PWA НЕ РАБОТАЕТ В TELEGRAM WEBAPP ИЛИ WEBVIEW!');
        console.log('📱 ДЛЯ УСТАНОВКИ PWA ОТКРОЙТЕ ССЫЛКУ В ОБЫЧНОМ БРАУЗЕРЕ');
        console.log('🔗 Скопируйте ссылку:', window.location.href);
        
        // Показываем предупреждение
        setTimeout(() => {
          console.log('⚠️ Показываем предупреждение о Telegram WebApp...');
          showTelegramWarning();
        }, 1000);
      } else {
        console.log('✅ НЕ TELEGRAM WEBAPP - PWA МОЖЕТ РАБОТАТЬ');
      }
      
      // Переменные для PWA
      let deferredPrompt = null;
      let isInstalled = false;
      
      // Проверка статуса подключения
      function updateOnlineStatus() {
        const indicator = document.getElementById('offline-indicator');
        if (navigator.onLine) {
          indicator.classList.remove('show');
        } else {
          indicator.classList.add('show');
        }
      }

      // Слушатели событий для статуса сети
      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);
      updateOnlineStatus();

      // PWA Install Events
      window.addEventListener('beforeinstallprompt', (e) => {
        console.log('💰 PWA: beforeinstallprompt fired');
        console.log('💰 PWA: Event details:', e);
        console.log('💰 PWA: Platforms:', e.platforms);
        e.preventDefault();
        deferredPrompt = e;
        
        // Показываем кастомный prompt через 3 секунды
        setTimeout(() => {
          if (!isInstalled) {
            console.log('💰 PWA: Showing install prompt');
            showInstallPrompt();
          } else {
            console.log('💰 PWA: App already installed, not showing prompt');
          }
        }, 3000);
      });

      // Добавляем слушатель для отладки установки
      window.addEventListener('DOMContentLoaded', () => {
        console.log('💰 PWA: DOM loaded, checking install criteria...');
        
        // Проверяем критерии установки PWA
        setTimeout(() => {
          console.log('💰 PWA: Install criteria check:');
          console.log('- Service Worker registered:', navigator.serviceWorker.controller !== null);
          console.log('- Manifest linked:', document.querySelector('link[rel="manifest"]') !== null);
          console.log('- HTTPS or localhost:', location.protocol === 'https:' || location.hostname === 'localhost');
          console.log('- Has icons:', document.querySelectorAll('link[rel*="icon"]').length > 0);
        }, 2000);
      });

      // Показать install prompt
      function showInstallPrompt() {
        const prompt = document.getElementById('pwa-install-prompt');
        if (prompt && !isInstalled) {
          prompt.classList.add('show');
        }
      }

      // Скрыть install prompt
      function hideInstallPrompt() {
        const prompt = document.getElementById('pwa-install-prompt');
        if (prompt) {
          prompt.classList.remove('show');
        }
      }

      // Обработчик кнопки установки
      document.getElementById('pwa-install-btn')?.addEventListener('click', async () => {
        if (!deferredPrompt) {
          console.log('💰 PWA: No deferred prompt available');
          return;
        }

        try {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          
          console.log('💰 PWA: User choice:', outcome);
          
          if (outcome === 'accepted') {
            console.log('💰 PWA: User accepted the install prompt');
            isInstalled = true;
          } else {
            console.log('💰 PWA: User dismissed the install prompt');
          }
          
          deferredPrompt = null;
          hideInstallPrompt();
        } catch (error) {
          console.error('💰 PWA: Error during installation:', error);
        }
      });

      // Обработчик кнопки "Позже"
      document.getElementById('pwa-dismiss-btn')?.addEventListener('click', () => {
        hideInstallPrompt();
        
        // Показать снова через 24 часа
        localStorage.setItem('pwa-dismiss-time', Date.now().toString());
      });

      // Проверка, не был ли prompt отложен
      const dismissTime = localStorage.getItem('pwa-dismiss-time');
      if (dismissTime) {
        const dayInMs = 24 * 60 * 60 * 1000;
        if (Date.now() - parseInt(dismissTime) < dayInMs) {
          // Не показываем prompt в течение 24 часов
          console.log('💰 PWA: Install prompt dismissed recently');
        } else {
          localStorage.removeItem('pwa-dismiss-time');
        }
      }

      // Обработка успешной установки
      window.addEventListener('appinstalled', () => {
        console.log('💰 PWA: App was installed');
        isInstalled = true;
        hideInstallPrompt();
        deferredPrompt = null;
        
        // Уведомляем пользователя
        if ('serviceWorker' in navigator && 'Notification' in window) {
          navigator.serviceWorker.ready.then((registration) => {
            registration.showNotification('Babay Кассир установлен!', {
              body: 'Приложение успешно установлено и готово к работе',
              icon: '/cashier-icon-192.png',
              badge: '/cashier-icon-96.png',
              tag: 'install-success'
            });
          });
        }
      });

      // Регистрация Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            console.log('💰 PWA: Registering Service Worker...');
            const registration = await navigator.serviceWorker.register('/cashier/sw.js', {
              scope: '/'
            });
            console.log('💰 PWA: Service Worker registered successfully:', registration);
            console.log('💰 PWA: Registration scope:', registration.scope);
            console.log('💰 PWA: Registration state:', registration.installing?.state || 'installed');
            
            // Ждем активации Service Worker
            if (registration.installing) {
              console.log('💰 PWA: Service Worker installing...');
              registration.installing.addEventListener('statechange', () => {
                console.log('💰 PWA: Service Worker state changed:', registration.installing?.state);
              });
            }
            
            // Проверяем, что Service Worker активен
            await navigator.serviceWorker.ready;
            console.log('💰 PWA: Service Worker is ready and active');
            
            // Проверяем обновления каждые 60 секунд
            setInterval(() => {
              registration.update();
            }, 60000);
            
            // Слушаем сообщения от Service Worker
            navigator.serviceWorker.addEventListener('message', (event) => {
              console.log('💰 PWA: Message from SW:', event.data);
              
              if (event.data.type === 'SYNC_COMPLETE') {
                console.log('💰 PWA: Background sync completed');
              }
            });
            
          } catch (error) {
            console.error('💰 PWA: Service Worker registration failed:', error);
            console.error('💰 PWA: Error details:', error.message);
          }
        });
      } else {
        console.error('💰 PWA: Service Worker not supported in this browser');
      }

      // Запрос разрешения на уведомления
      if ('Notification' in window && Notification.permission === 'default') {
        setTimeout(() => {
          Notification.requestPermission().then((permission) => {
            console.log('💰 PWA: Notification permission:', permission);
          });
        }, 5000);
      }

      // Проверка, запущено ли как PWA
      function isPWA() {
        return window.matchMedia('(display-mode: standalone)').matches ||
               window.navigator.standalone === true;
      }

      if (isPWA()) {
        console.log('💰 PWA: Running as PWA');
        document.body.classList.add('pwa-mode');
        isInstalled = true;
      } else {
        console.log('💰 PWA: Running in browser');
      }

      // Обработка жестов для PWA
      if (isPWA()) {
        // Предотвращаем zoom в PWA
        document.addEventListener('gesturestart', (e) => e.preventDefault());
        document.addEventListener('gesturechange', (e) => e.preventDefault());
        
        // Предотвращаем контекстное меню
        document.addEventListener('contextmenu', (e) => e.preventDefault());
      }

      console.log('💰 Cashier PWA: Initialized successfully');
      
      // Показать предупреждение о Telegram WebApp
      function showTelegramWarning() {
        // Создаем предупреждение
        const warning = document.createElement('div');
        warning.innerHTML = `
          <div style="
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10001;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
          ">
            <div style="
              background: white;
              border-radius: 12px;
              padding: 24px;
              max-width: 400px;
              text-align: center;
              box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            ">
              <div style="font-size: 48px; margin-bottom: 16px;">⚠️</div>
              <h3 style="margin: 0 0 12px 0; color: #dc2626; font-size: 18px;">PWA не работает в Telegram</h3>
              <p style="margin: 0 0 20px 0; color: #374151; font-size: 14px; line-height: 1.5;">
                Для установки PWA приложения кассира необходимо открыть ссылку в обычном браузере (Chrome, Safari, Edge).
              </p>
              <div style="display: flex; gap: 8px; justify-content: center;">
                <button onclick="copyUrlToClipboard()" style="
                  background: #3b82f6;
                  color: white;
                  border: none;
                  padding: 8px 16px;
                  border-radius: 6px;
                  font-size: 12px;
                  cursor: pointer;
                ">📋 Копировать ссылку</button>
                <button onclick="closeWarning()" style="
                  background: #6b7280;
                  color: white;
                  border: none;
                  padding: 8px 16px;
                  border-radius: 6px;
                  font-size: 12px;
                  cursor: pointer;
                ">Закрыть</button>
              </div>
            </div>
          </div>
        `;
        
        document.body.appendChild(warning);
        
        // Функции для кнопок
        window.copyUrlToClipboard = () => {
          const url = window.location.href;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(url).then(() => {
              alert('Ссылка скопирована! Откройте её в Chrome или другом браузере.');
            });
          } else {
            // Fallback для старых браузеров
            const textArea = document.createElement('textarea');
            textArea.value = url;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            alert('Ссылка скопирована! Откройте её в Chrome или другом браузере.');
          }
        };
        
        window.closeWarning = () => {
          if (warning.parentNode) {
            warning.parentNode.removeChild(warning);
          }
        };
      }

      // Добавляем кнопку принудительной установки
      function addForceInstallButton() {
        if (window.matchMedia('(display-mode: standalone)').matches) {
          console.log('✅ Already running as PWA');
          return;
        }
        
        // Не показываем кнопку в Telegram WebApp
        if (isTelegramWebApp || isInWebView) {
          console.log('🚫 Install button disabled in Telegram WebApp');
          return;
        }

        const button = document.createElement('button');
        button.innerHTML = '📱 Установить PWA';
        button.style.cssText = `
          position: fixed;
          top: 10px;
          left: 10px;
          z-index: 10000;
          background: #f97316;
          color: white;
          border: none;
          padding: 8px 16px;
          border-radius: 6px;
          font-size: 12px;
          cursor: pointer;
          box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        `;
        
        button.onclick = () => {
          // Показываем инструкцию для ручной установки
          const isChrome = /Chrome/.test(navigator.userAgent);
          const isSafari = /Safari/.test(navigator.userAgent) && !/Chrome/.test(navigator.userAgent);
          const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
          const isTablet = /iPad|Android.*(?=.*Tablet)|Android.*(?=.*Tab)/i.test(navigator.userAgent);
          
          let instructions = '';
          
          if (isTablet || isMobile) {
            if (isChrome) {
              instructions = `
📱 Установка PWA на планшет/телефон (Chrome):

1. Найдите иконку ⊕ в адресной строке
2. Или: Меню (⋮) → "Добавить на главный экран"
3. Подтвердите установку
4. Найдите ярлык на главном экране

Если не работает:
- Обновите страницу
- Попробуйте режим инкогнито
- Убедитесь что используете Chrome (не браузер внутри другого приложения)
              `;
            } else if (isSafari) {
              instructions = `
📱 Установка PWA на iPad (Safari):

1. Нажмите кнопку "Поделиться" (квадрат со стрелкой)
2. Выберите "На экран Домой"
3. Нажмите "Добавить"
4. Найдите ярлык на главном экране

Примечание: На iPad функциональность ограничена
              `;
            } else {
              instructions = `
📱 Для установки PWA на планшет:

Рекомендуется использовать Chrome или Edge браузер.
Не используйте браузер внутри других приложений (Telegram, Facebook и т.д.)

1. Откройте в Chrome
2. Найдите кнопку "Добавить на главный экран"
3. Подтвердите установку
              `;
            }
          } else {
            if (isChrome) {
              instructions = `
💻 Установка PWA на компьютер (Chrome):

1. Нажмите на иконку ⊕ в адресной строке
2. Или: Меню (⋮) → "Установить Babay Кассир"  
3. Подтвердите установку

Если иконки нет:
- Попробуйте обновить страницу
- Или откройте в режиме инкогнито
- Проверьте DevTools > Application > Manifest
              `;
            } else {
              instructions = 'Для установки PWA рекомендуется использовать Chrome или Edge браузер';
            }
          }
          
          alert(instructions.trim());
        };
        
        document.body.appendChild(button);
        
        // Скрываем кнопку через 30 секунд
        setTimeout(() => {
          if (button.parentNode) {
            button.parentNode.removeChild(button);
          }
        }, 30000);
      }

      // Добавляем кнопку через 2 секунды
      setTimeout(addForceInstallButton, 2000);

      // Загружаем тестовый скрипт для отладки (только в dev режиме)
      if (location.hostname === 'localhost') {
        const script = document.createElement('script');
        script.src = '/pwa-test.js';
        document.head.appendChild(script);
        console.log('🧪 PWA Test script loaded. Use testPWA() in console for diagnostics.');
      }
    </script>
  </body>
</html>
