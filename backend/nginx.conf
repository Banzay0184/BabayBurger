# Конфигурация nginx для увеличения лимита размера загружаемых файлов
# Этот файл должен быть скопирован в /etc/nginx/sites-available/ или включен в основную конфигурацию

server {
    listen 80;
    server_name api.babayfood.uz www.babayfood.uz babayfood.uz;
    
    # Увеличиваем лимит размера тела запроса до 10MB
    client_max_body_size 10M;
    
    # Увеличиваем таймауты для больших файлов
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    # Увеличиваем размер буфера для больших заголовков
    large_client_header_buffers 4 16k;
    
    # Проксируем запросы к Django
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Увеличиваем таймауты для прокси
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Увеличиваем размер буфера для прокси
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # Статические файлы
    location /static/ {
        alias /app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Медиа файлы
    location /media/ {
        alias /app/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# HTTPS конфигурация (если используется SSL)
